name: pygbag_build
on: [workflow_dispatch]

# The deploy step pushes the build to the gh-pages branch; the default token is read-only.
permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build with pygbag
      run: |
            python -m pip install pygbag
            # pygbag refuses MP3 in the assets; the web build plays bg.ogg instead (game/music.py).
            rm -f assets/sounds/*.mp3
            # WAV plays fine in browsers; pygbag only nags about it.
            python -m pygbag --build --disable-sound-format-error $GITHUB_WORKSPACE/main.py
    - name: Upload to GitHub pages branch gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: build/web
